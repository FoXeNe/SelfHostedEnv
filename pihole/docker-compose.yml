services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 8080:80/tcp
      - 8443:443/tcp
    environment:
      TZ: Europe/Moscow
      FTLCONF_webserver_api_password: ${PASSWORD}
      FTLCONF_dns_listeningMode: ALL
      PIHOLE_DNS_: 8.8.8.8;1.1.1.1
    volumes:
      - ./etc-pihole:/etc/pihole
    restart: unless-stopped
networks: {}

