name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: docker
    container:
      image: node:20-alpine 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          apk add --no-cache ansible

      - name: Run Ansible
        run: |
          ansible-playbook deploy.yml -i "localhost," --connection=local
